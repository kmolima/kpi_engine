system: 
   name: 'GSSI IoT'
   qas:
   - quality:
       name: Performance
       weight: 2.0
       kpis:
       - kpi:
           name: kpi1
           sub_quality:
             name: Time Response
             weight: 2.0
           eval_interval: 5s
           formula: 'rate(emqx_messages_publish_total)'
           target_value:
             assessment: '>= 90'
           fault_budget: 1
           period: 1h
           unit: '%'
           description: 'MQTT correctness: Percentage of successfully handled Publish messages per second. Fail criteria: rate of successfully processed PUBLISH messages falls under 90%.'
       - kpi:
           name: kpi2
           sub_quality:
             name: Capacity
             weight: 2.0
           eval_interval: 3s
           formula: 'emqx_messages_publish_total'
           target_value:
            assessment: '>= 1000'
           fault_budget: 3
           period: 1s
           unit: 'msg/s'
           description: 'MQTT capacity: Number of successfully handled Publish messages per second. Threshold is initially set to 1000.'
   alerts:
   - alert:
       name: fault
       rule: '!kpi1 OR !kp2'
       eval_interval: null
       notification:
         name: null
         rule: null
       action: null
   - alert:
       name: failure
       rule: '!kpi1 AND !kp2'
       eval_interval: null
       notification:
         name:
           rule: null
       action: nulll